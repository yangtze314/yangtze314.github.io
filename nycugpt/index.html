<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問問 ChatGPT</title>
</head>

<body>
    <p>「學長不是 AI，但 ChatGPT 是」</p>
    <p>集合<a href="https://sites.google.com/view/nycunewbie">陽明交大新生常見問答</a>全站的精華，再也不用麻煩可憐的學長，不會被好管閒事的喵星人碎嘴！</p>
    <p style="font-weight: bold;">有什麼問題，問問全能的 ChatGPT 吧！</p>
    <textarea id="query" rows="5" cols="60" spellcheck="false" placeholder="問問全能的 ChatGPT……"></textarea>
    <button id="submit">送出</button>
    <script>
        const query = document.getElementById("query");
        const submit = document.getElementById("submit");

        submit.addEventListener("click", function () {
            if (query.value) {
                window.location.href = "https://chatgpt.com/?q=" + encodeURIComponent(`請根據 https://github.com/yangtze314/yangtze314.github.io/blob/main/nycugpt/%E9%99%BD%E6%98%8E%E4%BA%A4%E5%A4%A7%E6%96%B0%E7%94%9F%E5%B8%B8%E8%A6%8B%E5%95%8F%E7%AD%94.md 的內容，回答以下問題：` + query.value + `如果查無資料，請回答「新生常見問答沒有相關資訊喔！你可能得去問問學長姐～」。`);
            }
        });
    </script>
</body>

</html>
